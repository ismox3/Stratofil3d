<style>

  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;

}

  --ok-bg:#183323; --warn-bg:#3A2C12; --bad-bg:#3D1C19; --info-bg:#162B3D;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1210; --surface:#171B18; --surface-2:#1F2420; --line:#2B322C;
  --fg:#ECF0E8; --muted:#97A196; --accent:#C6F432; --lime:#C6F432; --lime-ink:#141A05;
  --ok:#5BD18A; --warn:#F0B451; --bad:#F2766C; --info:#6CB6F2;
  --ok-bg:#183323; --warn-bg:#3A2C12; --bad-bg:#3D1C19; --info-bg:#162B3D;

<div class="wrap">

  </header>

  <main id="main">
    <h1 class="view">Inicio</h1>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <p class="muted small">Cargando los datos de tu negocio…</p>
  </main>
</div>
<button class="fab" id="fab" data-act="newVenta" hidden>+ Venta</button>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<div class="toast" id="toast" hidden></div>

<script>
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return 0; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => { n = r2(n || 0); return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
const pct = n => (n === null || !isFinite(n)) ? '—' : (n * 100).toFixed(1) + '%';
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fdate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const daysSince = s => s ? Math.max(0, Math.round((Date.parse(today()) - Date.parse(s)) / 864e5)) : 0;
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const title = s => String(s || '').toLowerCase().replace(/(^|[\s(/-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const DEF = {
  tax: 0.07, tarifaPie: 34, stockMin: 3, mesesCobertura: 2,
  metodos: [{n:'EFECTIVO USD',c:0},{n:'ZELLE',c:0},{n:'PAGO MÓVIL',c:0},{n:'TRANSFERENCIA BS',c:0},{n:'BINANCE / USDT',c:0}],
  categorias: ['DELIVERY LOCAL','EMPAQUES','PUBLICIDAD','COMISIONES BANCARIAS','HERRAMIENTAS / EQUIPOS','SERVICIOS','OTROS'],
  proveedores: ['BAMBU LAB US'],
  tipos: ['PLA BASIC','PLA PURE','PLA SILK+','PLA MATTE','PETG BASIC','ABS','ACCESORIO'],
  presentaciones: ['CON SPOOL','REFILL','UNIDAD'],
  negocio: { nombre: 'StratoFil3D', whatsapp: '', instagram: '', ciudad: 'Maracaibo' }
};
const COLS = ['productos','compras','ventas','encamino','apartados','gastos','clientes'];

/* ============ conexión con tu Google Sheet ============ */
const SHEET_ID = '1pqmDnkzPCPrjwNeghiVCEymI1tjyZzZ1tJt2YnB-DfM';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';
const SRV = 'Google Sheets';
const SH = {
  productos: { tab: 'Inventario', last: 'P', max: 204 },
  compras:   { tab: 'Compras', last: 'Q', max: 504 },
  ventas:    { tab: 'Ventas', last: 'W', max: 504 },
  encamino:  { tab: "'En Camino'", last: 'O', max: 204 },
  apartados: { tab: 'Apartados', last: 'N', max: 204 },
  gastos:    { tab: 'Gastos', last: 'F', max: 504 },
  clientes:  { tab: 'Clientes', last: 'G', max: 504 },
  params:    { tab: "'Parámetros'", range: "'Parámetros'!A4:H61" }
};
const rangeOf = k => SH[k].range || (SH[k].tab + '!A5:' + SH[k].last + SH[k].max);

/* ============ estado ============ */
const S = { productos:[], compras:[], ventas:[], encamino:[], apartados:[], gastos:[], clientes:[], params:null, meta:null,
  raw:{}, loaded:new Set(), tab: lsGet('sf_tab') || 'inicio', sub:null, year:new Date().getFullYear(),
  invFilter:'todos', invQ:'', ventasQ:'', catEnCamino:true, uid:null, canWrite:true, offline:false,
  sheetErr:null, busy:false, lastSync:null };
let C = null, installEvt = null;

const cfg = () => {
  const c = Object.assign({}, DEF, S.params || {});
  const m = S.meta || {};
  c.negocio = Object.assign({}, DEF.negocio, m.negocio || {});
  c.hex = m.hex || {};
  return c;
};
const prod = code => S.productos.find(p => p.codigo === code);
const isAcc = p => p && (p.presentacion === 'UNIDAD' || p.tipo === 'ACCESORIO');
const comPct = m => { const x = cfg().metodos.find(z => z.n === m); return x ? num(x.c) / 100 : 0; };

/* ============ cálculos (misma lógica que tu hoja) ============ */
function compraLine(x) {
  const c = cfg(), q = num(x.cantidad), sub = num(x.subtotal), tax = sub * c.tax, p = prod(x.codigo);
  let est = null;
  if (p && num(p.largo) && num(p.ancho) && num(p.alto)) est = q * num(p.largo) * num(p.ancho) * num(p.alto) / 1728 * c.tarifaPie;
  const real = (x.envioReal !== null && x.envioReal !== undefined && x.envioReal !== '');
  const env = real ? num(x.envioReal) : (est || 0);
  const total = sub + tax + env;
  return { q, sub, tax, est, env, total, unit: q ? total / q : 0 };
}
function calc() {
  const c = cfg(), P = {};
  const blank = p => ({ p, compradas:0, vendidas:0, sub:0, tax:0, env:0, tot:0, enCamino:0, apartado:0, vend90:0 });

const TABS = [['inicio','Inicio'],['inventario','Inventario'],['ventas','Ventas'],['cobrar','Cobrar'],['mas','Más']];
function renderTabs() {

function go(tab, sub) { S.tab = tab; S.sub = sub || null; lsSet('sf_tab', tab); render(); window.scrollTo(0, 0); }

/* ============ render ============ */
function render() {
  C = calc();
  renderTabs();
  renderSync();
  const ready = S.loaded.size >= COLS.length + 1;
  $('#fab').hidden = !(can() && ready && (S.tab === 'inicio' || S.tab === 'ventas'));
  $('#banner').innerHTML = S.sheetErr ? '<div class="banner">' + esc(S.sheetErr) + ' <a href="' + SHEET_URL + '" target="_blank" rel="noopener" style="color:inherit">Abrir la hoja</a></div>' : '';
  const views = { inicio: vInicio, inventario: vInventario, ventas: vVentas, cobrar: vCobrar, mas: vMas };
  let html;
  if (!API || !KEY) html = vSetup();
  else if (!ready) html = '<h1 class="view">' + (S.sheetErr ? 'Sin datos' : 'Leyendo tu hoja') + '</h1>' + (S.sheetErr ? '<p class="muted small">Cuando la conexión con tu hoja funcione, tus datos aparecerán aquí.</p><button class="btn pri" data-act="reload">Reintentar</button>' : '<div class="skel"></div><div class="skel"></div><div class="skel"></div><p class="muted small">Cargando inventario, ventas y pedidos desde Google Sheets…</p>');
  else if (S.tab === 'mas' && S.sub) html = SUBS[S.sub]();
  else html = views[S.tab]();
  const act = document.activeElement, keep = act && act.id && $('#main').contains(act) ? { id: act.id, s: act.selectionStart } : null;
  $('#main').innerHTML = html;
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.focus(); try { n.setSelectionRange(keep.s, keep.s); } catch (e) {} } }
}
const head = (t, back) => '<h1 class="view">' + (back ? '<button class="back" data-act="back" aria-label="Volver">‹</button>' : '') + esc(t) + '</h1>';

    + '<div class="f"><label class="lb" for="su_k">Clave</label><input id="su_k" name="clave" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX" value="' + esc(KEY) + '" required></div>'

const can = () => S.canWrite && !!API && !!KEY;

function vInicio() {
  const y = new Date().getFullYear(), mi = new Date().getMonth();
  const R = resumen(y), M = R.m[mi];
  const cob = porCobrar(), totCob = cob.reduce((s, x) => s + x.total, 0);
  let valor = 0, units = 0, bajo = 0, camino = 0, apartados = 0, rep = 0;
  for (const k in C.P) { const e = C.P[k]; valor += e.valor; units += e.disp; camino += e.enCamino; rep += e.costoRep; if (e.estado === 'STOCK BAJO' || e.estado === 'REVISAR') bajo++; }
  const apPend = S.apartados.filter(a => (a.estado || 'APARTADO') === 'APARTADO');
  const pedidos = new Set(S.encamino.filter(x => x.estado !== 'RECIBIDO').map(x => x.pedido)).size;
  let h = '<div class="kpis">'
    + '<div class="kpi hero"><div class="l">Ventas de ' + MESES[mi].toLowerCase() + '</div><div class="v">' + money(M.ventas) + '</div><div class="s">' + M.units + ' unidades · utilidad neta ' + money(M.neta) + '</div></div>'
    + '<div class="kpi"><div class="l">Te deben</div><div class="v">' + money(totCob) + '</div><div class="s">' + cob.length + ' cliente' + (cob.length === 1 ? '' : 's') + '</div></div>'
    + '<div class="kpi"><div class="l">Valor inventario</div><div class="v">' + money(valor) + '</div><div class="s">' + units + ' unidades</div></div>'
    + '<div class="kpi"><div class="l">Utilidad neta ' + y + '</div><div class="v">' + money(R.T.neta) + '</div><div class="s">margen ' + pct(R.T.margen) + '</div></div>'
    + '<div class="kpi"><div class="l">En camino</div><div class="v">' + camino + '</div><div class="s">' + pedidos + ' pedido' + (pedidos === 1 ? '' : 's') + '</div></div>'
    + '</div>';
  if (installEvt) h += '<button class="alert p-info" data-act="install"><b>Instalar StratoFil3D</b>&nbsp;en este teléfono ›</button>';
  if (can()) h += '<div class="quick"><button class="btn" data-act="newVenta"><span>＋</span>Venta</button><button class="btn" data-act="newApartado"><span>⏸</span>Apartado</button><button class="btn" data-act="newGasto"><span>−</span>Gasto</button></div>';
  h += '<h2 class="sec">Pendientes</h2>';
  const al = [];
  if (bajo) al.push('<button class="alert p-warn" data-act="goInv" data-f="bajo"><b>' + bajo + '</b> producto' + (bajo === 1 ? '' : 's') + ' con stock bajo y nada en camino</button>');
  if (apPend.length) al.push('<button class="alert p-info" data-act="goSub" data-s="apartados"><b>' + apPend.length + '</b> apartado' + (apPend.length === 1 ? '' : 's') + ' por entregar</button>');
  if (cob.length) al.push('<button class="alert p-bad" data-act="tab" data-k="cobrar"><b>' + money(totCob) + '</b> por cobrar · la deuda más vieja tiene ' + Math.max(...cob.map(x => daysSince(x.oldest))) + ' días</button>');
  if (pedidos) al.push('<button class="alert p-mut" data-act="goSub" data-s="pedidos"><b>' + pedidos + '</b> pedido' + (pedidos === 1 ? '' : 's') + ' en camino · márcalos como recibidos al llegar</button>');
  h += al.length ? al.join('') : '<div class="card muted small">Todo al día.</div>';
  h += '<h2 class="sec">Ventas y utilidad ' + y + '<span class="r"><button class="btn sm ghost" data-act="goSub" data-s="resumen">Ver resumen</button></span></h2>' + chartMeses(R);
  const top = Object.values(C.P).filter(e => e.vendidas > 0).sort((a, b) => b.vendidas - a.vendidas).slice(0, 5);
  h += '<h2 class="sec">Más vendidos</h2>';
  h += top.length ? '<div class="list">' + top.map(e => '<button class="row" data-act="prod" data-c="' + esc(e.p.codigo) + '">' + swatch(e.p) + '<div class="main"><div class="t">' + esc(title(e.p.color)) + '</div><div class="d">' + esc(e.p.tipo + ' · ' + title(e.p.presentacion)) + '</div></div><div class="end"><div class="big">' + e.vendidas + '</div><div class="d">vendidas</div></div></button>').join('') + '</div>'
    : '<div class="card empty"><b>Aún no hay ventas</b>Registra la primera con el botón “+ Venta”.</div>';
  return h;
}
function chartMeses(R) {
  const W = 340, H = 170, pl = 34, pb = 22, pt = 8, iw = W - pl - 6, ih = H - pb - pt;
  const max = Math.max(10, ...R.m.map(x => Math.max(x.ventas, x.neta)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const sy = v => pt + ih - (Math.max(0, v) / top) * ih;
  const bw = iw / 12;
  let g = '';
  for (let i = 0; i <= 2; i++) { const v = top * i / 2, y = sy(v); g += '<line x1="' + pl + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line)" stroke-width="1"/><text x="' + (pl - 4) + '" y="' + (y + 3) + '" text-anchor="end" style="fill:var(--muted)" font-size="9" font-family="JetBrains Mono, monospace">' + (v >= 1000 ? (v / 1000) + 'k' : v) + '</text>'; }
  R.m.forEach((x, i) => {
    const x0 = pl + i * bw + bw * 0.14, w = bw * 0.36;
    if (x.ventas > 0) g += '<rect x="' + x0 + '" y="' + sy(x.ventas) + '" width="' + w + '" height="' + (pt + ih - sy(x.ventas)) + '" rx="2" style="fill:var(--accent)"><title>' + MESES[i] + ' ventas ' + money(x.ventas) + '</title></rect>';
    if (x.neta > 0) g += '<rect x="' + (x0 + w + 1) + '" y="' + sy(x.neta) + '" width="' + w + '" height="' + (pt + ih - sy(x.neta)) + '" rx="2" style="fill:var(--fg);opacity:.55"><title>' + MESES[i] + ' utilidad ' + money(x.neta) + '</title></rect>';
    g += '<text x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" style="fill:var(--muted)" font-size="9.5">' + MESES[i][0] + '</text>';
  });
  return '<div class="chart"><div class="legend"><span><i style="background:var(--accent)"></i>Ventas</span><span><i style="background:var(--fg);opacity:.55"></i>Utilidad neta</span></div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ventas y utilidad neta por mes">' + g + '</svg></div>';
}

function vInventario() {
  const all = Object.values(C.P);
  const q = S.invQ.trim().toLowerCase();
  const F = { todos: () => true, disp: e => e.disp > 0, bajo: e => e.estado === 'STOCK BAJO' || e.estado === 'REVISAR', camino: e => e.enCamino > 0, apartado: e => e.apartado > 0, agotado: e => e.disp <= 0 };
  const list = all.filter(F[S.invFilter] || F.todos).filter(e => !q || (e.p.codigo + ' ' + e.p.color + ' ' + e.p.tipo + ' ' + e.p.presentacion).toLowerCase().includes(q));
  let tv = 0, tu = 0; for (const e of all) { tv += e.valor; tu += e.disp; }
  let h = head('Inventario') + '<div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="l">Disponibles</div><div class="v">' + tu + '</div><div class="s">' + all.length + ' productos</div></div><div class="kpi"><div class="l">Valor al costo</div><div class="v">' + money(tv) + '</div></div></div>';
  h += '<input class="search" id="invQ" type="search" placeholder="Buscar color, código o tipo" value="' + esc(S.invQ) + '" data-in="invQ">';
  h += '<div class="chips">' + [['todos','Todos'],['disp','Disponibles'],['bajo','Stock bajo'],['camino','En camino'],['apartado','Con apartados'],['agotado','Agotados']].map(([k, l]) => '<button class="chip" data-act="invF" data-f="' + k + '" aria-pressed="' + (S.invFilter === k) + '">' + l + '</button>').join('') + '</div>';
  if (can()) h += '<div class="btns" style="margin-bottom:10px"><button class="btn sm" data-act="newProd">+ Producto</button><button class="btn sm ghost" data-act="goSub2" data-s="reposicion">Qué pedir</button></div>';
  if (!list.length) return h + '<div class="card empty"><b>' + (all.length ? 'Nada coincide' : 'Sin productos todavía') + '</b>' + (all.length ? 'Prueba otro filtro.' : 'Agrega tu primer producto con “+ Producto”.') + '</div>';
  const groups = {};
  for (const e of list) (groups[e.p.tipo] = groups[e.p.tipo] || []).push(e);
  const order = cfg().tipos;
  Object.keys(groups).sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99)).forEach(t => {
    const g = groups[t].sort((a, b) => (a.p.presentacion || '').localeCompare(b.p.presentacion || '') || a.p.color.localeCompare(b.p.color));
    h += '<h2 class="sec">' + esc(t) + '<span class="r">' + g.reduce((s, e) => s + e.disp, 0) + ' disp.</span></h2><div class="list">';
    h += g.map(e => '<button class="row" data-act="prod" data-c="' + esc(e.p.codigo) + '">' + swatch(e.p) + '<div class="main"><div class="t">' + esc(title(e.p.color)) + '</div><div class="d"><span class="mono">' + esc(e.p.codigo) + '</span> · ' + esc(title(e.p.presentacion)) + ' · ' + money(e.precio) + (e.enCamino ? ' · <b>+' + e.enCamino + '</b> en camino' : '') + (e.apartado ? ' · ' + e.apartado + ' apart.' : '') + '</div></div><div class="end"><div class="big">' + e.disp + '</div>' + (e.estado !== 'OK' ? pill(e.estado) : '<div class="d">disp.</div>') + '</div></button>').join('');
    h += '</div>';
  });
  return h;
}

  const q = S.ventasQ.trim().toLowerCase();
  const list = S.ventas.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || num(b.numero) - num(a.numero))
    .filter(v => !q || (v.cliente + ' ' + v.numero + ' ' + (v.items || []).map(i => prodName(i.codigo)).join(' ')).toLowerCase().includes(q));
  let h = head('Ventas');
  h += '<input class="search" id="ventasQ" type="search" placeholder="Buscar cliente, número o producto" value="' + esc(S.ventasQ) + '" data-in="ventasQ">';
  if (!list.length) return h + '<div class="card empty"><b>' + (S.ventas.length ? 'Nada coincide' : 'Aún no hay ventas') + '</b>' + (S.ventas.length ? '' : 'Toca “+ Venta” para registrar la primera.') + '</div>';
  let mk = '';

    const t = vt(v), m = (v.fecha || '').slice(0, 7);
    let s = '';
    if (m !== mk) { if (mk) s += '</div>'; mk = m; const [yy, mm] = m.split('-'); const mt = list.filter(x => (x.fecha || '').startsWith(m)).reduce((a, x) => a + vt(x).total, 0); s += '<h2 class="sec">' + MESES[+mm - 1] + ' ' + yy + '<span class="r num">' + money(mt) + '</span></h2><div class="list">'; }

  }).join('') + '</div>';

function vCobrar() {
  const cob = porCobrar(), tot = cob.reduce((s, x) => s + x.total, 0);
  const aps = S.apartados.filter(a => (a.estado || 'APARTADO') === 'APARTADO').map(a => ({ a, t: apTotals(a) }));
  let h = head('Por cobrar');
  h += '<div class="kpis"><div class="kpi hero"><div class="l">Total que te deben</div><div class="v">' + money(tot) + '</div><div class="s">' + cob.length + ' cliente' + (cob.length === 1 ? '' : 's') + ' con ventas sin pagar completas</div></div></div>';
  h += '<h2 class="sec">Por cliente</h2>';
  if (!cob.length) h += '<div class="card empty"><b>Nadie te debe</b>Las ventas con saldo pendiente aparecen aquí.</div>';
  else h += '<div class="list">' + cob.map(x => {
    const d = daysSince(x.oldest), cl = clienteDe(x.cliente);
    return '<div class="row" style="cursor:default;flex-wrap:wrap"><div class="main"><div class="t">' + esc(x.cliente) + '</div><div class="d">' + x.ventas.length + ' venta' + (x.ventas.length === 1 ? '' : 's') + ' · desde ' + fdate(x.oldest) + ' · <b style="color:' + (d > 15 ? 'var(--bad)' : d > 7 ? 'var(--warn)' : 'var(--muted)') + '">' + d + ' día' + (d === 1 ? '' : 's') + '</b>' + (cl && cl.telefono ? '' : ' · sin teléfono') + '</div></div><div class="end"><div class="big">' + money(x.total) + '</div></div>'
      + '<div class="btns" style="width:100%"><a class="btn sm pri" target="_blank" rel="noopener" href="' + esc(waLink(cl && cl.telefono, msgCobro(x))) + '">WhatsApp</a><button class="btn sm" data-act="copyCobro" data-cl="' + esc(x.cliente) + '">Copiar mensaje</button>' + (can() ? '<button class="btn sm ghost" data-act="pago" data-id="' + esc(x.ventas[0].v.id) + '">Registrar pago</button>' : '') + '</div></div>';
  }).join('') + '</div>';
  h += '<h2 class="sec">Detalle por venta</h2>';
  h += cob.length ? '<div class="list">' + cob.flatMap(x => x.ventas).sort((a, b) => a.v.fecha.localeCompare(b.v.fecha)).map(({ v, t }) => '<button class="row" data-act="venta" data-id="' + esc(v.id) + '"><div class="main"><div class="t">' + esc(v.cliente) + ' · N° ' + esc(v.numero) + '</div><div class="d">' + fdate(v.fecha) + ' · total ' + money(t.total) + ' · pagó ' + money(t.pagado) + '</div></div><div class="end"><div class="big">' + money(t.saldo) + '</div>' + pill(t.estado) + '</div></button>').join('') + '</div>' : '';
  if (aps.length) {
    h += '<h2 class="sec">Apartados con saldo<span class="r">' + money(aps.reduce((s, x) => s + x.t.saldo, 0)) + '</span></h2><div class="list">' + aps.map(({ a, t }) => '<button class="row" data-act="apartado" data-id="' + esc(a.id) + '"><div class="main"><div class="t">' + esc(a.cliente) + ' · ' + esc(a.numero) + '</div><div class="d">' + fdate(a.fecha) + ' · abonó ' + money(t.pagado) + ' de ' + money(t.total) + '</div></div><div class="end"><div class="big">' + money(t.saldo) + '</div></div></button>').join('') + '</div>';
  }
  return h;
}
function msgCobro(x) {
  const n = cfg().negocio, nombre = String(x.cliente).split(' ')[0];
  const det = x.ventas.map(({ v, t }) => '• Compra del ' + fdate(v.fecha) + ' (N° ' + v.numero + '): ' + money(t.saldo)).join('\n');
  return 'Hola ' + nombre + ', ¿cómo estás? Te escribo de ' + n.nombre + ' para recordarte el saldo pendiente de *' + money(x.total) + '*:\n' + det + '\n\nPuedes pagar por ' + cfg().metodos.map(m => title(m.n)).join(', ') + '. Avísame cuando lo hagas para registrarlo. ¡Gracias!';

const SUBS = {
  apartados() {
    const list = S.apartados.slice().sort((a, b) => ((a.estado || 'APARTADO') === 'APARTADO' ? 0 : 1) - ((b.estado || 'APARTADO') === 'APARTADO' ? 0 : 1) || (b.fecha || '').localeCompare(a.fecha || ''));
    let h = head('Apartados', true);
    if (can()) h += '<div class="btns" style="margin-bottom:10px"><button class="btn pri sm" data-act="newApartado">+ Apartado</button></div>';
    if (!list.length) return h + '<div class="card empty"><b>Sin apartados</b>Cuando un cliente reserve productos, regístralo aquí.</div>';
    return h + '<div class="list">' + list.map(a => { const t = apTotals(a); const est = a.estado || 'APARTADO'; const listos = (a.items || []).every(it => (C.P[it.codigo] || {}).disp >= num(it.cantidad));
      return '<button class="row" data-act="apartado" data-id="' + esc(a.id) + '"><div class="main"><div class="t">' + esc(a.cliente) + ' · ' + esc(a.numero) + '</div><div class="d">' + fdate(a.fecha) + ' · ' + t.units + ' prod.' + (est === 'APARTADO' ? (listos ? ' · <b style="color:var(--ok)">listo para entregar</b>' : ' · esperando mercancía') : '') + '</div></div><div class="end"><div class="big">' + money(t.total) + '</div>' + pill(est) + '</div></button>'; }).join('') + '</div>';
  },
  pedidos() { return vPedidos('encamino'); },
  compras() { return vPedidos('compras'); },
  gastos() {
    const list = S.gastos.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    let h = head('Gastos', true);
    if (can()) h += '<div class="btns" style="margin-bottom:10px"><button class="btn pri sm" data-act="newGasto">+ Gasto</button></div>';

function vPedidos(kind) {

  let h = head(recibido ? 'Compras' : 'Pedidos en camino', true);

  if (!recibido) h += '<p class="muted small" style="margin-top:0">Al llegar un pedido, ábrelo y toca “Marcar como recibido”: pasa solo a Compras y suma al inventario.</p>';

  return h + '<div class="list">' + list.map(g => {

    const pend = !recibido && g.lines.some(x => x.estado !== 'RECIBIDO');

  }).join('') + '</div>';

function clientesStats() {
  return S.clientes.map(c => {
    const vs = S.ventas.filter(v => String(v.cliente).trim().toLowerCase() === String(c.nombre).trim().toLowerCase());
    let total = 0, saldo = 0, ultima = ''; for (const v of vs) { const t = vt(v); total += t.total; saldo += t.saldo; if (v.fecha > ultima) ultima = v.fecha; }
    return { c, n: vs.length, total, saldo, ultima };
  }).sort((a, b) => b.saldo - a.saldo || b.total - a.total || String(a.c.nombre).localeCompare(b.c.nombre));
}
function catGroups() {
  const by = {};
  for (const k in C.P) {
    const e = C.P[k]; if (e.p.missing || e.p.oculto) continue;
    const stockLibre = e.disp - Math.max(0, e.apartado - e.enCamino);
    const show = S.catEnCamino ? e.libre > 0 : stockLibre > 0;
    if (!show) continue;
    e.apartadoDeStock = Math.max(0, e.apartado - e.enCamino);
    const key = e.p.tipo + '|' + e.p.presentacion + '|' + e.precio;
    (by[key] = by[key] || { tipo: e.p.tipo, pres: e.p.presentacion, precio: e.precio, items: [] }).items.push(e);
  }
  const order = cfg().tipos;
  return Object.values(by).sort((a, b) => (order.indexOf(a.tipo) + 1 || 99) - (order.indexOf(b.tipo) + 1 || 99) || a.pres.localeCompare(b.pres)).map(g => (g.items.sort((a, b) => a.p.color.localeCompare(b.p.color)), g));
}
function catText() {
  const n = cfg().negocio, gs = catGroups();
  let t = '*' + n.nombre.toUpperCase() + '* · Filamentos Bambu Lab originales\n' + (n.ciudad ? n.ciudad + ' · ' : '') + 'Precios en USD\n';
  for (const g of gs) { t += '\n*' + g.tipo + ' · ' + title(g.pres) + ' — ' + money(g.precio) + '*\n'; t += g.items.map(e => '• ' + title(e.p.color) + (e.disp - e.apartadoDeStock > 0 ? '' : ' _(llega pronto)_')).join('\n') + '\n'; }
  t += '\nPagos: ' + cfg().metodos.map(m => title(m.n)).join(', ') + '.';
  if (n.whatsapp) t += '\nPedidos: ' + n.whatsapp; if (n.instagram) t += '\nInstagram: ' + n.instagram;
  return t;
}

function readLines(mode) {
  return [...document.querySelectorAll('#lines [data-line]')].map(el => {
    const g = s => el.querySelector(s);
    const o = { codigo: g('.l-p').value, cantidad: num(g('.l-q').value) };
    if (mode === 'compra' || mode === 'pedido') { o.subtotal = num(g('.l-s').value); if (g('.l-e')) o.envioReal = g('.l-e').value.trim() === '' ? null : num(g('.l-e').value); }
    else { o.precio = num(g('.l-pr').value); o.descuento = num(g('.l-d').value); }
    return { el, o };
  });
}
function updateLines() {
  const form = document.querySelector('#sheetCard form'); if (!form) return;
  const mode = form.dataset.form, isSale = mode === 'venta' || mode === 'apartado';
  const editId = form.dataset.id;
  let total = 0, desc = 0, bruto = 0, costo = 0, sub = 0;
  const need = {};
  for (const { el, o } of readLines(mode)) {
    const info = el.querySelector('.l-info'), e = C.P[o.codigo];
    info.className = 'l-info'; info.textContent = '';
    if (!o.codigo || !e) continue;
    if (isSale) {
      const prI = el.querySelector('.l-pr'); if (prI.value === '' ) prI.value = e.precio;
      const pr = num(prI.value);
      bruto += o.cantidad * pr; desc += o.descuento; total += o.cantidad * pr - o.descuento; costo += o.cantidad * (e.totalProm || 0);
      need[o.codigo] = (need[o.codigo] || 0) + o.cantidad;
      let own = 0; if (editId && mode === 'venta') { const d = S.ventas.find(x => x.id === editId); if (d) own = (d.items || []).filter(i => i.codigo === o.codigo).reduce((s, i) => s + num(i.cantidad), 0); }
      const avail = e.disp + own;
      if (mode === 'venta' && need[o.codigo] > avail) { info.className = 'l-info warn'; info.textContent = 'Solo hay ' + avail + ' disponible' + (avail === 1 ? '' : 's') + (e.enCamino ? ' (' + e.enCamino + ' en camino; regístralo como apartado)' : ''); }
      else info.textContent = 'Disponible ' + e.disp + ' · libre ' + e.libre + (e.totalProm !== null ? ' · costo ' + money(e.totalProm) : '');
    } else {
      sub += o.subtotal;
      const p = e.p; info.textContent = o.cantidad && o.subtotal ? 'Costo unitario ' + money(o.subtotal / o.cantidad) + ' + tax' : '';
    }
  }
  const sb = $('#sumbox'); if (!sb) return;
  if (isSale) sb.innerHTML = '<div><span>Subtotal</span><span class="num">' + money(bruto) + '</span></div>' + (desc ? '<div><span>Descuentos</span><span class="num">-' + money(desc) + '</span></div>' : '') + '<div class="tt"><span>Total</span><span class="num">' + money(total) + '</span></div><div class="muted small"><span>Ganancia estimada</span><span class="num">' + money(total - costo - total * comPct($('#v_m') ? $('#v_m').value : '')) + '</span></div>';
  else sb.innerHTML = '<div><span>Subtotal sin tax</span><span class="num">' + money(sub) + '</span></div><div><span>Tax ' + r2(cfg().tax * 100) + '%</span><span class="num">' + money(sub * cfg().tax) + '</span></div><div class="tt"><span>Total con tax</span><span class="num">' + money(sub * (1 + cfg().tax)) + '</span></div>';
  sb.dataset.total = total;
  const ci = $('#v_c'), tb = $('#telBox'); if (ci && tb) tb.hidden = !ci.value.trim() || !!clienteDe(ci.value);
}

/* ============ recibos ============ */
function reciboTexto(kind, d) {
  const n = cfg().negocio, isV = kind === 'venta', t = isV ? vt(d) : apTotals(d);
  let s = '*' + n.nombre.toUpperCase() + '*\n' + (isV ? 'Recibo de venta N° ' + d.numero : 'Comprobante de apartado ' + d.numero) + '\nFecha: ' + fdate(d.fecha) + '\nCliente: ' + d.cliente + '\n\n';
  s += (d.items || []).map(it => '• ' + num(it.cantidad) + ' × ' + prodName(it.codigo) + ' — ' + money(num(it.cantidad) * num(it.precio) - num(it.descuento)) + (num(it.descuento) ? ' (desc. ' + money(num(it.descuento)) + ')' : '')).join('\n');
  s += '\n\n*Total: ' + money(t.total) + '*\n' + (isV ? 'Pagado' : 'Abonado') + ': ' + money(t.pagado) + '\n' + (t.saldo > 0 ? (isV ? 'Saldo pendiente' : 'Resta por pagar') + ': ' + money(t.saldo) + '\n' : (isV ? 'Pagado completo. ¡Gracias!\n' : ''));
  if (!isV) s += 'Los productos quedan reservados a tu nombre.\n';
  return s + '\nGracias por tu compra en ' + n.nombre + '.';
}

function wrapText(ctx, text, maxW) { const words = String(text).split(' '); const lines = []; let l = ''; for (const w of words) { const t = l ? l + ' ' + w : w; if (ctx.measureText(t).width > maxW && l) { lines.push(l); l = w; } else l = t; } if (l) lines.push(l); return lines; }

async function saveBlob(name, blob, share) {
  if (share && navigator.canShare) {
    try { const f = new File([blob], name, { type: blob.type }); if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 8000); toast('Archivo descargado');
}
function saveCanvas(cv, name) { cv.toBlob(b => saveBlob(name.replace(/[^\w\-.]+/g, '_') + '.png', b, true), 'image/png'); }

/* ============ acciones ============ */
const pending = {};
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) { if (ev.target.id === 'sheet') closeSheet(); return; }
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case 'tab': closeSheet(); go(b.dataset.k); break;
    case 'back': go('mas'); break;
    case 'goSub': closeSheet(); go('mas', b.dataset.s); break;
    case 'goSub2': go('mas', b.dataset.s); break;
    case 'goInv': S.invFilter = b.dataset.f; go('inventario'); break;
    case 'invF': S.invFilter = b.dataset.f; render(); break;
    case 'year': S.year = +b.dataset.y; render(); break;
    case 'catCam': S.catEnCamino = b.dataset.v === '1'; render(); break;
    case 'closeSheet': closeSheet(); break;
    case 'prod': prodDetail(b.dataset.c); break;
    case 'newProd': prodForm(null); break;
    case 'editProd': prodForm(b.dataset.c); break;
    case 'delProd': { const p = prod(b.dataset.c); if (p && await W(async () => { await verify('productos', { [p.row]: p.sig }); await writeRows('productos', { [p.row]: BLANK.productos() }); }, 'Producto eliminado de la hoja')) closeSheet(); break; }
    case 'newVenta': ventaForm('venta'); break;
    case 'newApartado': ventaForm('apartado'); break;
    case 'editVenta': ventaForm('venta', S.ventas.find(x => x.id === id)); break;
    case 'editApartado': ventaForm('apartado', S.apartados.find(x => x.id === id)); break;
    case 'venta': ventaDetail(id); break;
    case 'apartado': apartadoDetail(id); break;
    case 'pago': pagoForm('ventas', id); break;
    case 'abono': pagoForm('apartados', id); break;
    case 'addLine': { document.querySelector('#lines').insertAdjacentHTML('beforeend', lineHtml(null, b.dataset.m)); updateLines(); break; }
    case 'rmLine': { const ls = document.querySelectorAll('#lines [data-line]'); if (ls.length > 1) b.closest('[data-line]').remove(); updateLines(); break; }
    case 'applyDu': { const du = num($('#v_du').value); for (const { el, o } of readLines('venta')) el.querySelector('.l-d').value = du ? r2(du * o.cantidad) : ''; updateLines(); break; }
    case 'payAll': { $('#v_pag').value = num($('#sumbox').dataset.total).toFixed(2); break; }
    case 'askDel': {
      const key = b.dataset.k + id;
      if (pending[key]) { delete pending[key]; await doDelete(b.dataset.k, id); }
      else { pending[key] = 1; b.textContent = 'Toca otra vez para confirmar'; setTimeout(() => { delete pending[key]; if (b.isConnected) b.textContent = 'Eliminar'; }, 4000); }
      break; }
    case 'cancelAp': {
      const key = 'cancel' + id;
      if (pending[key]) { delete pending[key]; const a = S.apartados.find(x => x.id === id); if (a && await W(() => setApEstado(a, 'CANCELADO', 'Cancelado el ' + fdate(today())), 'Apartado cancelado')) closeSheet(); }
      else { pending[key] = 1; b.textContent = 'Toca otra vez para cancelar'; setTimeout(() => { delete pending[key]; if (b.isConnected) b.textContent = 'Cancelar apartado'; }, 4000); }
      break; }
    case 'entregar': await entregar(id); break;
    case 'recibo': reciboShow(b.dataset.k, id); break;
    case 'copyRecibo': { const d = (b.dataset.k === 'venta' ? S.ventas : S.apartados).find(x => x.id === id); copyText(reciboTexto(b.dataset.k, d)); break; }
    case 'saveImg': saveCanvas($('#rcv') || $('#catcv'), b.dataset.n); break;
    case 'copyCobro': { const x = porCobrar().find(z => z.cliente === b.dataset.cl); if (x) copyText(msgCobro(x)); break; }
    case 'copyRepo': { const rows = Object.values(C.P).filter(e => e.sugerido > 0); copyText('Pedido sugerido ' + fdate(today()) + '\n' + rows.map(e => '• ' + e.sugerido + ' × ' + e.p.codigo + ' ' + title(e.p.color) + ' (' + e.p.tipo + ', ' + title(e.p.presentacion) + ')').join('\n') + '\nCosto estimado: ' + money(rows.reduce((s, e) => s + e.costoRep, 0))); break; }
    case 'catCopy': copyText(catText()); break;
    case 'catImg': openSheet('Imagen del catálogo', '<canvas id="catcv" style="width:100%;height:auto;border-radius:12px;display:block"></canvas><div class="btns full" style="margin-top:12px"><button class="btn pri" data-act="saveImg" data-n="Catalogo-StratoFil3D-' + today() + '">Compartir imagen</button></div>', async () => { try { await document.fonts.ready; } catch (e) {} drawCatalogo($('#catcv')); }); break;
    case 'newPedido': pedidoForm('encamino'); break;
    case 'newCompra': pedidoForm('compras'); break;
    case 'pedido': pedidoDetail(b.dataset.k, b.dataset.p, b.dataset.f); break;
    case 'editPedido': { const rows = (b.dataset.k === 'compras' ? S.compras : S.encamino).filter(x => (x.pedido || 'Sin número') === b.dataset.p && x.fecha === b.dataset.f); pedidoForm(b.dataset.k, { fecha: b.dataset.f, pedido: b.dataset.p, proveedor: rows[0].proveedor, notas: rows[0].notas, lines: rows }); break; }
    case 'recibir': await recibir(b.dataset.p, b.dataset.f, $('#rc_f').value || today()); break;
    case 'newGasto': gastoForm(null); break;
    case 'gasto': if (can()) gastoForm(id); break;
    case 'newCliente': clienteForm(null); break;

    case 'backup': {

      saveBlob('respaldo-stratofil3d-' + today() + '.json', new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      break; }
    case 'csvVentas': {
      const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['Fecha','N° venta','Cliente','Código','Producto','Cantidad','Precio','Descuento','Total línea','Método','Estado de pago']];
      for (const v of S.ventas.slice().sort((a, b) => a.fecha.localeCompare(b.fecha))) { const t = vt(v); for (const it of v.items || []) rows.push([fdate(v.fecha), v.numero, v.cliente, it.codigo, prodName(it.codigo), it.cantidad, it.precio, num(it.descuento), r2(num(it.cantidad) * num(it.precio) - num(it.descuento)), v.metodo || '', t.estado]); }
      saveBlob('ventas-stratofil3d-' + today() + '.csv', new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' }));
      break; }
    case 'install': { if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); } break; }
    case 'reload': { S.sheetErr = null; render(); sync(); break; }
    case 'copyAccess': copyText(location.origin + location.pathname + '?api=' + encodeURIComponent(API) + '&k=' + encodeURIComponent(KEY)); break;
    case 'logout': { const key = 'logout'; if (pending[key]) { delete pending[key]; lsSet(LS_API, ''); lsSet(LS_KEY, ''); API = ''; KEY = ''; S.loaded.clear(); go('inicio'); } else { pending[key] = 1; b.textContent = 'Toca otra vez para desconectar'; setTimeout(() => { delete pending[key]; if (b.isConnected) b.textContent = 'Desconectar este teléfono'; }, 4000); } break; }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.in) { S[t.dataset.in] = t.value; const pos = t.selectionStart; render(); const n = document.getElementById(t.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } return; }
  if (t.closest && t.closest('#sheetCard form')) updateLines();
});
document.addEventListener('change', ev => { if (ev.target.closest && ev.target.closest('#sheetCard form')) { if (ev.target.classList.contains('l-p')) { const pr = ev.target.closest('[data-line]').querySelector('.l-pr'); if (pr) pr.value = ''; } updateLines(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

async function setApEstado(a, estado, nota) {
  await verify('apartados', a.sigs);
  const m = {};
  a.rows.forEach((r, i) => { const arr = new Array(14).fill(null); arr[12] = estado; if (i === 0 && nota) arr[13] = txt((a.notas ? a.notas + '. ' : '') + nota); m[r] = arr; });
  await writeRows('apartados', m);
}
async function doDelete(kind, id) {
  let ok;
  if (kind.endsWith('-group')) {
    const k = kind.replace('-group', ''), [p, f] = id.split('|');
    const rows = S[k].filter(x => (x.pedido || 'Sin número') === p && x.fecha === f);
    ok = await W(async () => { const sig = {}, m = {}; for (const r of rows) { sig[r.row] = r.sig; m[r.row] = BLANK[k](r.row); } await verify(k, sig); await writeRows(k, m); }, 'Eliminado de la hoja');
  } else if (kind === 'ventas' || kind === 'apartados') {
    const d = S[kind].find(x => x.id === id);
    ok = d && await W(async () => { await verify(kind, d.sigs); const m = {}; for (const r of d.rows) m[r] = BLANK[kind](r); await writeRows(kind, m); }, 'Eliminado de la hoja');
  } else {
    const d = S[kind].find(x => x.id === id);
    ok = d && await W(async () => { await verify(kind, { [d.row]: d.sig }); await writeRows(kind, { [d.row]: BLANK[kind](d.row) }); }, 'Eliminado de la hoja');
  }
  if (ok) closeSheet();
}
async function ensureCliente(nombre, tel) {
  await fresh('clientes');
  if (clienteDe(nombre)) return;
  const r = needRows('clientes', 1);
  await writeRows('clientes', { [r]: [txt(nombre), txt(tel || ''), '', '', txt(cfg().negocio.ciudad || ''), '', ''] });
}
async function entregar(id) {
  const a = S.apartados.find(x => x.id === id); if (!a) return;
  const falt = (a.items || []).filter(it => ((C.P[it.codigo] || {}).disp || 0) < num(it.cantidad));
  if (falt.length) { toast('Aún falta mercancía por llegar.'); return; }
  let numero;
  const ok = await W(async () => {
    await verify('apartados', a.sigs);
    await fresh('ventas');
    numero = nextVenta();
    const total = sumItems(a.items), pagado = a.abonoSum || 0;
    const v = { fecha: today(), numero, cliente: a.cliente, metodo: '', tasa: '', notas: ('Entrega del apartado ' + a.numero + (pagado ? ', con abonos por ' + money(pagado) : '') + '. ' + (a.notas || '')).trim() };
    const start = needRows('ventas', a.items.length);
    await writeRows('ventas', ventaRows(start, v, a.items, estadoPago(total, pagado), pagado));
    await setApEstado(a, 'ENTREGADO', 'Entregado como venta N° ' + numero + ' el ' + fdate(today()));
  }, 'Entregado y registrado como venta');
  if (ok) closeSheet();
}
async function recibir(pedido, fecha, llegada) {
  const rows = S.encamino.filter(x => (x.pedido || 'Sin número') === pedido && x.fecha === fecha && x.estado !== 'RECIBIDO');
  const ok = await W(async () => {
    const sig = {}; for (const r of rows) sig[r.row] = r.sig;
    await verify('encamino', sig);
    await fresh('compras');
    const start = needRows('compras', rows.length), m = {};
    rows.forEach((r, i) => { m[start + i] = compraRow({ fecha: r.fecha, pedido: r.pedido, proveedor: r.proveedor, codigo: r.codigo, cantidad: r.cantidad, subtotal: r.subtotal, envioReal: null, notas: (r.notas ? r.notas + '. ' : '') + 'Llegó el ' + fdate(llegada) }); });
    await writeRows('compras', m);
    const mm = {}; for (const r of rows) { const arr = new Array(14).fill(null); arr[12] = 'RECIBIDO'; arr[13] = serial(llegada); mm[r.row] = arr; }
    await writeRows('encamino', mm);
  }, 'Pedido recibido: ' + rows.reduce((s, r) => s + num(r.cantidad), 0) + ' unidades al inventario');
  if (ok) closeSheet();
}
const nextVenta = () => S.ventas.reduce((m, v) => Math.max(m, num(v.numero)), 0) + 1;
const nextApartado = () => 'A-' + String(S.apartados.reduce((m, v) => Math.max(m, num(String(v.numero || '').replace(/\D/g, ''))), 0) + 1).padStart(3, '0');
const contiguous = rows => rows.every((r, i) => i === 0 || r === rows[i - 1] + 1);
async function addToList(colIdx, value) {
  await fresh('params');
  const lists = (S.raw.params || []).slice(8);
  const vals = lists.map(r => cell(r, colIdx).toUpperCase());
  if (vals.includes(String(value).toUpperCase())) return;
  let idx = vals.findIndex(v => !v); if (idx < 0) idx = vals.length;
  if (idx >= 50) return;
  const arr = new Array(colIdx + 1).fill(null); arr[colIdx] = txt(value);
  await writeRows('params', { [12 + idx]: arr });
}

document.addEventListener('submit', async ev => {
  const f = ev.target; if (!f.dataset || !f.dataset.form) return;
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries()), err = m => { const e = f.querySelector('#formErr'); if (e) e.textContent = m; };
  const kind = f.dataset.form, id = f.dataset.id, btn = f.querySelector('button[type=submit]');
  if (kind === 'setup') {
    const a = (fd.api || '').trim(), k = (fd.clave || '').trim().toUpperCase();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(a)) return err('El enlace debe empezar con https://script.google.com/');
    btn && (btn.disabled = true); err('Conectando…');
    const oldA = API, oldK = KEY; API = a; KEY = k;
    try { await api({ op: 'ping' }, 30000); lsSet(LS_API, a); lsSet(LS_KEY, k); S.loaded.clear(); render(); toast('Conectado a tu hoja'); sync(); }
    catch (e) { API = oldA; KEY = oldK; err(errMsg(e, false)); }
    finally { btn && (btn.disabled = false); }
    return;
  }
  if (!can() && kind !== 'ajustes') return err('No hay conexión con la hoja.');
  btn && (btn.disabled = true);
  try {
    if (kind === 'prod') {
      const code = (f.dataset.c || fd.codigo).trim().toUpperCase();
      if (!/^[A-Z0-9_\-.]+$/.test(code)) return err('El código solo puede tener letras, números y guiones.');
      if (!f.dataset.c && prod(code)) return err('Ya existe un producto con ese código.');
      if (!fd.color.trim()) return err('Escribe el color o nombre.');
      const color = fd.color.trim().toUpperCase();
      const dim = v => v === '' ? '' : num(v);
      const arr = [codeVal(code), fd.tipo, txt(color), fd.presentacion, null, null, null, dim(fd.largo), dim(fd.ancho), dim(fd.alto), null, null, null, null, null, num(fd.precio)];
      const old = f.dataset.c ? prod(code) : null;
      const ok = await W(async () => {
        if (old) { await verify('productos', { [old.row]: old.sig }); await writeRows('productos', { [old.row]: arr }); }
        else { await fresh('productos'); if (prod(code)) throw Object.assign(new Error('Ya existe un producto con ese código en la hoja.'), { full: true }); const r = needRows('productos', 1); await writeRows('productos', { [r]: arr }); }
        await addToList(1, color); await addToList(0, fd.tipo);
        if (fd.hex && fd.hex !== (cfg().hex[code] || HEX[color])) { try { await saveMeta({ hex: { [code]: fd.hex } }); } catch (e) {} }
      }, 'Producto guardado en la hoja');
      if (ok) closeSheet();
    }
    else if (kind === 'venta' || kind === 'apartado') {
      const isV = kind === 'venta', k = isV ? 'ventas' : 'apartados';
      const items = readLines(kind).map(x => x.o).filter(o => o.codigo && o.cantidad > 0);
      if (!fd.cliente.trim()) return err('Escribe el nombre del cliente.');
      if (!items.length) return err('Agrega al menos un producto.');
      const old = id ? S[k].find(x => x.id === id) : null;
      if (isV) {
        const need = {}; for (const o of items) need[o.codigo] = (need[o.codigo] || 0) + o.cantidad;
        for (const c in need) { const own = old ? old.items.filter(i => i.codigo === c).reduce((s, i) => s + num(i.cantidad), 0) : 0; if (need[c] > (C.P[c] || {}).disp + own) return err('No hay suficiente ' + title(prod(c).color) + ' disponible. Si viene en camino, regístralo como apartado.'); }
      }
      const nombre = fd.cliente.trim(), total = sumItems(items), pagoIni = num(fd.pagado);
      let notas = (fd.notas || '').trim();
      if (!old && pagoIni > 0) notas = (notas ? notas + '. ' : '') + (isV ? 'Pagó ' : 'Abonó ') + money(pagoIni) + ' el ' + fdate(fd.fecha) + (fd.metodo ? ' por ' + title(fd.metodo) : '');
      const ok = await W(async () => {
        let start;
        if (old) {
          await verify(k, old.sigs);
          if (items.length <= old.rows.length && contiguous(old.rows)) {
            start = old.rows[0];
            const m = {}; for (const r of old.rows.slice(items.length)) m[r] = BLANK[k](r);
            if (Object.keys(m).length) await writeRows(k, m);
          } else {
            const m = {}; for (const r of old.rows) m[r] = BLANK[k](r);
            await writeRows(k, m); await fresh(k); start = needRows(k, items.length);
          }
        } else { await fresh(k); start = needRows(k, items.length); }
        const numero = old ? old.numero : (isV ? nextVenta() : nextApartado());
        const doc = { fecha: fd.fecha, numero, cliente: nombre, metodo: fd.metodo || '', tasa: isV && fd.tasa ? num(fd.tasa) : '', notas };
        if (isV) { const pagado = old ? vt(old).pagado : pagoIni; await writeRows('ventas', ventaRows(start, doc, items, estadoPago(total, pagado), pagado)); }
        else { doc.abono = old ? (old.abonoSum || 0) : pagoIni; doc.estado = 'APARTADO'; await writeRows('apartados', apRows(start, doc, items)); }
        await ensureCliente(nombre, (fd.telefono || '').trim());
      }, old ? 'Cambios guardados en la hoja' : (isV ? 'Venta registrada en la hoja' : 'Apartado registrado en la hoja'));
      if (ok) closeSheet();
    }
    else if (kind === 'pago') {
      const m = num(fd.monto); if (m <= 0) return err('Escribe un monto mayor a cero.');
      const k = f.dataset.k, d = S[k].find(x => x.id === id); if (!d) return;
      const nota = (k === 'ventas' ? 'Pagó ' : 'Abonó ') + money(m) + ' el ' + fdate(fd.fecha || today()) + (fd.metodo ? ' por ' + title(fd.metodo) : '');
      const ok = await W(async () => {
        await verify(k, d.sigs);
        const first = d.rows[0], mm = {};
        if (k === 'ventas') {
          const t = vt(d), pagado = t.pagado + m;
          const arr = new Array(23).fill(null); arr[19] = estadoPago(t.total, pagado); arr[20] = r2(pagado); arr[22] = txt((d.notas ? d.notas + '. ' : '') + nota);
          if (!d.metodo && fd.metodo) arr[11] = fd.metodo;
          mm[first] = arr;
          if (!d.metodo && fd.metodo) for (const r of d.rows.slice(1)) { const a2 = new Array(12).fill(null); a2[11] = fd.metodo; mm[r] = a2; }
        } else {
          const arr = new Array(14).fill(null); arr[11] = r2((d.abonoSum || 0) + m); arr[13] = txt((d.notas ? d.notas + '. ' : '') + nota);
          mm[first] = arr;
          for (const r of d.rows.slice(1)) { const a2 = new Array(12).fill(null); a2[11] = ''; mm[r] = a2; }
        }
        await writeRows(k, mm);
      }, 'Pago registrado en la hoja');
      if (ok) closeSheet();
    }
    else if (kind === 'pedido' || kind === 'compra') {
      const isC = kind === 'compra', k = isC ? 'compras' : 'encamino';
      const lines = readLines(kind).map(x => x.o).filter(o => o.codigo && o.cantidad > 0);
      if (!lines.length) return err('Agrega al menos un producto con cantidad.');
      if (lines.some(o => !o.subtotal)) return err('Falta el subtotal de alguna línea.');
      const orig = (f.dataset.orig ? JSON.parse(f.dataset.orig) : []).map(oid => S[k].find(x => x.id === oid)).filter(Boolean);
      const ok = await W(async () => {
        if (orig.length) { const sig = {}, m = {}; for (const r of orig) { sig[r.row] = r.sig; m[r.row] = BLANK[k](r.row); } await verify(k, sig); await writeRows(k, m); }
        await fresh(k);
        const start = needRows(k, lines.length), m = {};
        lines.forEach((o, i) => { const d = { fecha: fd.fecha, pedido: fd.pedido.trim(), proveedor: fd.proveedor.trim(), codigo: o.codigo, cantidad: o.cantidad, subtotal: o.subtotal, notas: i === 0 ? fd.notas : '', envioReal: o.envioReal, estado: 'EN CAMINO' }; m[start + i] = isC ? compraRow(d) : caminoRow(d); });
        await writeRows(k, m);
      }, isC ? 'Compra guardada en la hoja' : 'Pedido guardado en la hoja');
      if (ok) closeSheet();
    }
    else if (kind === 'gasto') {
      if (num(fd.monto) <= 0) return err('Escribe el monto.');
      const arr = [serial(fd.fecha), fd.categoria, txt(fd.descripcion), num(fd.monto), fd.metodo || '', txt(fd.notas || '')];
      const old = id ? S.gastos.find(x => x.id === id) : null;
      const ok = await W(async () => {
        if (old) { await verify('gastos', { [old.row]: old.sig }); await writeRows('gastos', { [old.row]: arr }); }
        else { await fresh('gastos'); await writeRows('gastos', { [needRows('gastos', 1)]: arr }); }
      }, 'Gasto guardado en la hoja');
      if (ok) closeSheet();
    }
    else if (kind === 'cliente') {
      if (!fd.nombre.trim()) return err('Escribe el nombre.');
      const old = id ? S.clientes.find(x => x.id === id) : null;
      const nombre = fd.nombre.trim();
      const arr = [txt(nombre), txt(fd.telefono), txt(fd.cedula), txt(fd.direccion), txt(fd.ciudad), txt(fd.correo), txt(fd.notas)];
      const ok = await W(async () => {
        if (old) {
          await verify('clientes', { [old.row]: old.sig }); await writeRows('clientes', { [old.row]: arr });
          if (old.nombre !== nombre) {
            for (const k of ['ventas', 'apartados']) { await fresh(k); const m = {}; for (const d of S[k].filter(x => x.cliente === old.nombre)) for (const r of d.rows) m[r] = [null, null, txt(nombre)]; if (Object.keys(m).length) await writeRows(k, m); }
          }
        } else { await fresh('clientes'); if (clienteDe(nombre)) throw Object.assign(new Error('Ya existe un cliente con ese nombre.'), { full: true }); await writeRows('clientes', { [needRows('clientes', 1)]: arr }); }
      }, 'Cliente guardado en la hoja');
      if (ok) closeSheet();
    }
    else if (kind === 'ajustes') {
      const lines = s => String(s || '').split('\n').map(x => x.trim().toUpperCase()).filter(Boolean);
      const metodos = String(fd.metodos || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [n, c] = l.split('='); return { n: n.trim().toUpperCase(), c: num(c) }; });
      const tipos = lines(fd.tipos), cats = lines(fd.categorias), provs = lines(fd.proveedores);
      const negocio = { nombre: fd.nombre.trim() || 'StratoFil3D', whatsapp: fd.whatsapp.trim(), instagram: fd.instagram.trim(), ciudad: fd.ciudad.trim() };
      if (Math.max(tipos.length, cats.length, provs.length, metodos.length) > 50) return err('Cada lista admite hasta 50 elementos.');
      const ok = await W(async () => {
        const m = { 4: [null, num(fd.tax) / 100], 5: [null, num(fd.tarifaPie)], 7: [null, Math.round(num(fd.stockMin))], 8: [null, Math.max(1, Math.round(num(fd.mesesCobertura)))] };
        for (let i = 0; i < 50; i++) m[12 + i] = [tipos[i] || '', null, null, metodos[i] ? metodos[i].n : '', metodos[i] ? metodos[i].c / 100 : '', null, cats[i] || '', provs[i] || ''];
        await writeRows('params', m);
        await saveMeta({ negocio });
      }, 'Ajustes guardados');
      if (!ok) err('No se pudieron guardar todos los ajustes.');
    }
  } finally { btn && (btn.disabled = false); }
});

/* ============ arranque ============ */
(function () {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('api') && q.get('k')) { API = q.get('api'); KEY = q.get('k').toUpperCase(); lsSet(LS_API, API); lsSet(LS_KEY, KEY); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
})();
let syncing = false;
async function sync() {
  if (!API || !KEY || syncing || S.busy) return;
  syncing = true;
  try { await readAll(); }
  catch (e) { S.sheetErr = errMsg(e, false); if (e.code === 'clave') { lsSet(LS_KEY, ''); KEY = ''; } }
  finally { syncing = false; render(); }
}
render();
sync();
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
window.addEventListener('online', sync);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
window.addEventListener('appinstalled', () => { installEvt = null; render(); toast('App instalada'); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
