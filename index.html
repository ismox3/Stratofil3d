<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F6F0">
<meta name="description" content="Inventario, ventas y cobros de StratoFil3D conectados a Google Sheets.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StratoFil3D">
<title>StratoFil3D</title>
<script>
/* el tema se aplica antes de pintar para que no parpadee */
(function () {
  var t = 'auto';
  try { t = localStorage.getItem('sf_tema') || 'auto'; } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=9">
</head>
<body>

<header class="top"><div class="top-in">
  <button class="brand" data-act="tab" data-k="inicio" aria-label="StratoFil3D, ir al inicio">
    <img class="lg-d" alt="" src="logo-oscuro.png" width="47" height="32"><img class="lg-l" alt="" src="logo-claro.png" width="47" height="32">
  </button>
  <div class="spacer"></div>
  <button class="sync" id="sync" data-act="reload" aria-live="polite"><i></i><span>Abriendo…</span></button>
</div></header>

<div class="wrap">
  <div id="banner"></div>
  <main id="main">
    <div class="skel tall"></div><div class="skel"></div><div class="skel"></div>
  </main>
</div>

<button class="fab" id="fab" data-act="sh" data-s="nuevo" hidden></button>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>
<div class="dlg" id="dlg" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">StratoFil3D necesita JavaScript para funcionar.</p></noscript>
<script src="datos.js?v=9"></script>
<script src="docs.js?v=9"></script>
<script src="app.js?v=9"></script>
<script src="hojas.js?v=9"></script>
</body>
</html>
